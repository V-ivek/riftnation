version: 1

project:
  name: riftnation
  description: >-
    Open-source community-first marketplace for Riftbound TCG trading in
    Dubai / UAE. The codebase starts with a NestJS Catalog bounded context
    that syncs the official Riftbound card catalog into Postgres; listings,
    collections, payments, and decentralized settlement layers will come in
    later bounded contexts.

policy:
  sections:
    - id: overview
      title: Project overview
      body: |
        Riftnation is an open-source marketplace aimed at the UAE Riftbound
        community. The first bounded context is **catalog**: a NestJS module
        that syncs official card data (from the public Riftbound card gallery
        page) into Postgres on a daily schedule, then exposes normalized
        card queries for downstream contexts. A companion GitHub Actions cron
        runs the sync at 11:00 Asia/Dubai daily.

        Future bounded contexts (listings, collections, pricing, payments)
        will live in their own modules inside the same NestJS monolith until
        a split is justified.
      renderers: [agents_md, claude_md, copilot_instructions]

    - id: source-of-truth
      title: Source of truth for design
      body: |
        - `docs/plans/2026-04-18-catalog-sync-design.md` — the approved
          design for the catalog sync write path.
        - `docs/plans/2026-04-18-catalog-rfc-addendum-observed-fields.md` —
          schema additions observed in the live Riot payload.
        - `docs/plans/2026-04-18-catalog-sync-implementation.md` — the
          step-by-step TDD implementation plan. Execute tasks in order;
          commit per task.
        - `docs/prompts/riftnation-catalog-ddd-rfc-nestjs.md` — the RFC v0.1
          the catalog context is built against.

        If any of these conflict with code in the repo, prefer the newest
        doc and leave a brief note in a follow-up commit.
      renderers: [agents_md, claude_md, copilot_instructions]

    - id: conventions
      title: Coding conventions
      body: |
        - TypeScript strict mode; no `any` unless unavoidable at an adapter
          boundary with a local ESLint disable comment explaining why.
        - Follow DDD layering inside each bounded context: `domain/`,
          `application/`, `infrastructure/`, `api/`. I/O lives at the edges;
          `domain/` has zero imports from `infrastructure/` or `api/`.
        - Value objects guard invariants at the domain boundary. Prefer them
          over primitive types in aggregate state.
        - Tests live next to the code: `foo.ts` + `foo.spec.ts`. Integration
          tests that need Postgres use `@testcontainers/postgresql`.
        - Write the failing test first, then the minimal implementation that
          makes it pass, then commit.
        - Never hard-delete rows in the catalog tables; tombstone via
          `deleted_at` and restore when upstream re-publishes a record.
      renderers: [agents_md, claude_md, copilot_instructions]

    - id: commit-discipline
      title: Commit discipline
      body: |
        - One concern per commit.
        - Subject line ≤ 72 chars, imperative mood, Conventional-Commit
          prefix when it fits (`feat`, `fix`, `chore`, `docs`, `test`,
          `ci`, `refactor`).
        - Body (when helpful) explains the *why*, not the *what*.
        - Every commit ends with an `Assisted-by:` footer per the
          Attribution section. Human-only commits use `Assisted-by: n/a`.
        - Never use `--no-verify` or `--amend` on a published commit
          without explicit user approval.
      renderers: [agents_md, claude_md, copilot_instructions]

    - id: detailed-workflow
      title: Detailed execution workflow (for agents running the implementation plan)
      body: |
        When executing
        `docs/plans/2026-04-18-catalog-sync-implementation.md`:

        1. Read the full task before touching files.
        2. Start with the failing test listed in the task.
        3. Run only that test to confirm it fails with the expected reason.
        4. Write the minimal implementation.
        5. Re-run the test; confirm it passes.
        6. Stage only the files the task lists; commit with a Conventional
           Commit subject and the `Assisted-by:` footer.
        7. Move to the next task.

        Do not batch multiple tasks into one commit. Do not silently skip
        tests. If a task needs amending, stop and escalate to the user
        rather than drifting from the plan.
      renderers: [agents_md]

attribution:
  assisted_by:
    required: true
    format: "Assisted-by: {agent}:{model}"
    human_marker: "Assisted-by: n/a"
    allow_multiple: true

renderers:
  agents_md:
    enabled: true
    path: AGENTS.md
  claude_md:
    enabled: true
    path: CLAUDE.md
    concise: true
  copilot_instructions:
    enabled: true
    path: .github/copilot-instructions.md
    concise: true
